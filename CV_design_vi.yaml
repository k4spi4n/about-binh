      - name: DynaTour - Giải pháp tour 3D bất động sản từ video điện thoại
        date: 2026
        link: https://dynatour.io.vn/
        highlights:
          - Tự động biến video quay không gian từ điện thoại thành các tour 3D tương tác sống động cho căn hộ, bất động sản.
          - Hỗ trợ khách hàng trải nghiệm không gian từ xa chân thực, tối ưu hóa tỷ lệ chuyển đổi và tăng tốc độ chốt giao dịch.
          - "Công nghệ: React, WebGL / Three.js, Computer Vision, 3D Reconstruction"
      - name: Runny AI - Trợ lý chạy bộ thông minh tích hợp AI Coach
        date: 2025 - 2026
        link: https://github.com/k4spi4n/runny-ai
        highlights:
          - Phát triển ứng dụng trợ lý chạy bộ cá nhân kết hợp dữ liệu tập luyện, HLV ảo AI Coach và cộng đồng.
          - Tự động đồng bộ Strava API, trực quan hóa Pace/Heart Rate và quản lý hao mòn giày (Shoe Tracker).
          - "Công nghệ: Flutter, Supabase (Database, Auth, Edge Functions), AI Coach"
      - name: Hệ thống Quản lý Bệnh viện Thông minh (Smart Hospital Management System)
        date: 2025
        link: https://github.com/k4spi4n/cmec-hms-web-app
        highlights:
          - Phát triển hệ thống thông tin và quản lý bệnh viện toàn diện, số hóa quy trình vận hành.
          - Tích hợp AI để hỗ trợ tóm tắt hồ sơ y tế, chẩn đoán bệnh án và hỗ trợ quyết định lâm sàng.
          - "Công nghệ: PostgreSQL, Supabase, Next.js, FastAPI, AI"
      - name: Website hỗ trợ cá nhân hoá học tập dựa trên AI
        date: 2025
        highlights:
          - Tự động hóa quy trình tạo đề thi, bài tập và cá nhân hóa trải nghiệm học tập cho học sinh.
          - Hỗ trợ giáo viên quản lý lớp học, theo dõi tiến độ và đưa ra quyết định giảng dạy dựa trên dữ liệu.
          - "Công nghệ: Angular, .NET, MongoDB, AI"
