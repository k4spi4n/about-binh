        date: 2025 - 2026
        link: https://github.com/k4spi4n/runny-ai
        highlights:
          - Phụ trách database và backend/AI trong nhóm 4 sinh viên cho app Flutter trợ lý chạy bộ (biểu đồ Pace/Heart Rate, Shoe Tracker, AI Coach).
          - Đồng bộ Strava API; điều phối LLM trên Edge Functions giữa 4 nhà cung cấp (gồm model tự host), có circuit breaker và retry.
          - "Công nghệ: Flutter, Supabase, LLM Routing, Strava API"
      - name: Hệ thống Quản lý Bệnh viện Thông minh (Smart Hospital Management System)
        date: 2025
        link: https://github.com/k4spi4n/cmec-hms-web-app
        highlights:
