      - name: PMA - Nền tảng LMS B2B cho đào tạo doanh nghiệp
        date: 2026
        link: https://b2bpmp.io.vn/
        highlights:
          - Lập trình viên chính (full-stack & DevOps) hệ thống LMS vận hành thực tế cho một doanh nghiệp đào tạo và các khách hàng doanh nghiệp của họ, với hơn 10 lớp đào tạo và hơn 30 giảng viên, nhân sự; cùng BA chuyển yêu cầu thành tính năng.
          - Lịch học tự động né ngày lễ, checklist trợ giảng 5 giai đoạn, điểm danh, kho tài liệu, ngân hàng câu hỏi, bài kiểm tra chấm điểm, phân quyền 5 vai trò; tích hợp Google Calendar/Gmail/Drive; CI/CD Docker.
          - "Công nghệ: Next.js, PostgreSQL, Docker CI/CD, Google APIs · Link: [b2bpmp.io.vn](https://b2bpmp.io.vn/)"
      - name: DynaTour - Giải pháp tour 3D bất động sản từ video điện thoại
        date: 2026
        link: https://dynatour.io.vn/
        highlights:
          - Kỹ sư chính trong nhóm 4 sinh viên. Top 10 NEU Startup Olympiad 2026.
          - Xây dựng API FastAPI trên Cloud Run, Supabase Postgres (RLS, RPC trừ điểm idempotent) và pipeline GPU serverless dựng 3D Gaussian Splatting, lọc video bằng CPU trước khi cấp GPU để tiết kiệm chi phí.
          - "Công nghệ: FastAPI, Supabase, 3D Gaussian Splatting, Serverless GPU · Link: [dynatour.io.vn](https://dynatour.io.vn/)"
      - name: Pair Time - Game bạn đồng hành cho người code (itch.io)
        date: 2026
        link: https://k4spi4n.itch.io/pair-time
        highlights:
          - "Phát triển và phát hành game mô phỏng cozy cho Windows bằng Godot .NET và C#: nhân vật phản ứng theo hook của các coding agent (Claude Code, Codex, OpenCode) chạy trong terminal nhúng qua ConPTY; chế độ overlay trong suốt luôn nằm trên cùng."
          - "Công nghệ: Godot .NET, C#, ConPTY, Win32 · Link: [k4spi4n.itch.io/pair-time](https://k4spi4n.itch.io/pair-time)"
      - name: Runny AI - Trợ lý chạy bộ thông minh tích hợp AI Coach
        date: 2025 - 2026
        link: https://github.com/k4spi4n/runny-ai
        highlights:
          - "Database và backend/AI trong nhóm 4 sinh viên cho app Flutter trợ lý chạy bộ: đồng bộ Strava API, điều phối LLM trên Edge Functions giữa 4 nhà cung cấp (gồm model tự host), có circuit breaker và retry."
          - "Công nghệ: Flutter, Supabase, LLM Routing, Strava API · Link: [runny-ai.onrender.com](https://runny-ai.onrender.com/)"
      - name: Hệ thống Quản lý Bệnh viện Thông minh
        date: 2025
        link: https://github.com/k4spi4n/cmec-hms-web-app
        highlights:
          - Tự phát triển full-stack và AI backend; AI tóm tắt hồ sơ y tế, gợi ý chẩn đoán và trợ lý chat ngay trong hồ sơ bệnh án.
          - "Công nghệ: Next.js, FastAPI, Supabase (PostgreSQL), LLM"
    Giải thưởng:
      - bullet: "**Giải Khuyến khích bảng B, CSCV 2026** - Cuộc thi Sinh viên An ninh mạng 2026 (CTF jeopardy); đội trưởng CMC.CBS, hạng 10/47 đội chung khảo (chọn từ 334 đội thi trong nước và quốc tế) với 2.080 điểm (2026)"
      - bullet: "**Top 10 NEU Startup Olympiad 2026** - Dự án DynaTour, Đại học Kinh tế Quốc dân (2026)"
      - bullet: "**Giải Khuyến khích Sinh viên Nghiên cứu khoa học cấp trường 2025-2026** - Đại học CMC (2026)"
